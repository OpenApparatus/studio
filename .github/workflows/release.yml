name: Release

# Builds Velopack installers for Windows + macOS (x64 + arm64) on every tag
# matching v*.*.* and uploads them as a GitHub Release.
#
# Usage:
#   git tag v0.1.0
#   git push --tags
#
# Outputs (per platform) attached to the release:
#   - OpenApparatusStudio-win-Setup.exe
#   - OpenApparatusStudio-osx-x64-Setup.pkg
#   - OpenApparatusStudio-osx-arm64-Setup.pkg
#   - Plus full + delta .nupkg update artifacts (consumed by the in-app updater)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write

env:
  STUDIO_PROJECT: src/OpenApparatus.Studio/OpenApparatus.Studio.csproj
  PACK_ID: OpenApparatusStudio
  PACK_TITLE: OpenApparatus Studio
  PACK_AUTHORS: OpenApparatus

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            channel: win
            artifact: win
          - os: macos-latest
            rid: osx-x64
            channel: osx-x64
            artifact: osx-x64
          - os: macos-latest
            rid: osx-arm64
            channel: osx-arm64
            artifact: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout studio
        uses: actions/checkout@v4
        with:
          path: openapparatus-studio

      # Studio's csproj references Core as a sibling ProjectReference. Until
      # Core ships on NuGet we clone it next to the studio checkout.
      - name: Checkout core (sibling)
        uses: actions/checkout@v4
        with:
          repository: OpenApparatus/core
          path: openapparatus-core

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Publish (${{ matrix.rid }})
        shell: bash
        working-directory: openapparatus-studio
        run: |
          dotnet publish "$STUDIO_PROJECT" \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:OpenApparatusCoreRepo="$GITHUB_WORKSPACE/openapparatus-core/" \
            -o publish

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: openapparatus-studio
        run: |
          vpk pack \
            --packId "$PACK_ID" \
            --packTitle "$PACK_TITLE" \
            --packAuthors "$PACK_AUTHORS" \
            --packVersion "${{ steps.version.outputs.version }}" \
            --packDir publish \
            --mainExe OpenApparatus.Studio.exe \
            --channel ${{ matrix.channel }} \
            --outputDir releases

      - name: Pack (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: openapparatus-studio
        run: |
          # On macOS, Velopack expects the publish output to be wrapped in a .app bundle
          # before packing. `vpk pack` handles bundle generation when --packDir points at
          # the publish output and --mainExe is the platform binary name.
          vpk pack \
            --packId "$PACK_ID" \
            --packTitle "$PACK_TITLE" \
            --packAuthors "$PACK_AUTHORS" \
            --packVersion "${{ steps.version.outputs.version }}" \
            --packDir publish \
            --mainExe OpenApparatus.Studio \
            --channel ${{ matrix.channel }} \
            --outputDir releases

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.artifact }}
          path: openapparatus-studio/releases/**
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.exe' -o -name '*.pkg' -o -name '*.dmg' -o -name '*.nupkg' -o -name 'RELEASES*' \) -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
